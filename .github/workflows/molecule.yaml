# yamllint disable
---
name: Molecule test

on:
  pull_request:
    branches:
      - main
    paths:
      - 'roles/wireguard/**'
      - 'molecule/wireguard/**'
      - '.github/workflows/**'
  workflow_dispatch:
  schedule:
      - cron: '0 1 1 * *'

jobs:
  standalone:
    name: Test Wireguard Ansible Role
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        config:
          - image: "ubuntu2204"
            tag: "latest"
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # robertdebock/molecule-action ships an old ansible-core that cannot talk to the
      # current Galaxy API, so Molecule is installed and run directly instead.
      - name: Install Molecule and Ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Molecule for Ansible
        run: molecule test
        env:
          image: ${{ matrix.config.image }}
          tag: ${{ matrix.config.tag }}
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

      - name: Upload configs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-configs-${{ matrix.config.image }}
          path: clients/
          retention-days: 1
          if-no-files-found: ignore
