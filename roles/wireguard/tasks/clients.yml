---

- name: List of defined clients
  ansible.builtin.set_fact:
    _list_of_defined_clients: "{{ _list_of_defined_clients | default([]) + [item.publickey] }}"
  with_items: "{{ wireguard_peers }}"

- name: Delete unused client configs
  ansible.builtin.shell: |
    cd "{{ wireguard_clients_dir }}"
    if [ ! -z "$(grep -L '''"{{ _list_of_defined_clients | join("\|") }}"''' *.conf)" ]; then
      rm -f $(grep -L '''"{{ _list_of_defined_clients | join("\|") }}"''' *.conf) \
      && echo "deleted"
    fi
  register: _delete_out
  args:
    executable: /bin/bash
  changed_when: "'deleted' in _delete_out.stdout"

- name: Create clients configs
  ansible.builtin.template:
    src: "clients.conf.j2"
    dest: "{{ wireguard_clients_dir }}/{{ item.WireGuardPeer.0 | json_query('FriendlyName') }}.conf"
    mode: 0644
  vars:
    server_public_key: "{{ _pubkey_value['content'] | b64decode }}"
    preshared_key: "{{ _pskkey_value['content'] | b64decode }}"
    # Definition of the current peer from wireguard_peers (carries per-peer client options)
    _peer_def: "{{ wireguard_peers | selectattr('name', 'equalto', item.WireGuardPeer.0.FriendlyName) | first | default({}) }}"
    # Backward compatibility: PersistentKeepalive was always rendered from peer.keepalive / wireguard_keepalive,
    # so it stays as the base value, which client_peer_options can override (or drop with null).
    _client_keepalive: "{{ _peer_def.keepalive | default(wireguard_keepalive) }}"
    # Precedence of client options: per-peer > global > role defaults
    _client_interface_options: >-
      {{ wireguard_client_interface_options
         | combine(_peer_def.client_interface_options | default({})) }}
    _client_peer_options: >-
      {{ {'PersistentKeepalive': _client_keepalive}
         | combine(wireguard_client_peer_options, _peer_def.client_peer_options | default({})) }}
  loop: "{{ peers | list }}"
  notify:
    - Restart systemd-networkd

- name: Download client configs
  ansible.builtin.fetch:
    src: "{{ wireguard_clients_dir }}/{{ item.name }}.conf"
    dest: "{{ wireguard_clients_download_dir }}/{{ inventory_hostname }}/"
    flat: true
  run_once: "{{ wireguard_same_keys | bool }}"
  loop: "{{ wireguard_peers | list }}"
  when: wireguard_download_clients | bool
